<!DOCTYPE html> <!-- Define el tipo de documento HTML5 -->
<html lang="es"> <!-- Elemento raíz del documento -->
<head>
    <meta charset="UTF-8"> <!-- Configuración de codificación de caracteres -->
    <title>TIID 04_02</title> <!-- Título visible en la pestaña del navegador -->
    <link rel="stylesheet" href="style.css">
</head>
<body> <!-- Contenido principal visible en la página -->

    <header>
        <h1>mi contenido</h1>
        <nav> <!-- Barra de navegación -->
            <ul> <!-- Lista desordenada para las secciones -->
                <li><a href="https://www.upp.edu.mx/" target="_blank">Inicio</a></li>
                <li><a href="#contacto">Contacto</a></li>
                <li><a href="#registro">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="box">
            <h2>bienvenido a mi sitio web</h2>
            <p>Contenido del artículo....</p>
        </div>

        <section>
            <h2>noticias</h2>
            <article>
                <h3>titulo1</h3>
                <p>Contenido del artículo....</p>
                
                <!-- Imagen que funciona como enlace hacia una URL externa -->
                <a href="https://www.upp.edu.mx/" target="_blank">
                    <img src="https://web.dev/static/html/image/hero-html_480.png?hl=es-419" alt="Ilustración de HTML">
                </a>
            </article>
        </section>

        <!-- Sección de Formulario/Registro con su ID de destino -->
        <section id="registro">
            <h2>noticias</h2>
            <p>Formulario o información de registro aquí...</p>
        </section>

        <aside> <!-- Barra lateral -->
            <h3>titulo1</h3>
        </aside>
    </main>

    <!-- Pie de página con ID de contacto -->
    <footer id="contacto">
        <p>&copy; 2026 Todos los derechos reservados</p>
    </footer>

</body>
</html>
